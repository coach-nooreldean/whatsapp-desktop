<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Accounts</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>

  <!-- Pull handle shown when collapsed -->
  <div class="pull-handle" id="pullHandle" title="إظهار الشريط الجانبي (Ctrl+Alt+S)"></div>

  <div class="accounts-container" id="accountsList"></div>

  <button class="add-btn" id="addAccountBtn" title="إضافة حساب جديد (Ctrl+Alt+A)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <button class="action-btn" id="privacyBtn" title="درع الخصوصية / Privacy Shield (Ctrl+Alt+P)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
  </button>

  <button class="action-btn" id="lockBtn" title="قفل التطبيق / Lock App (Ctrl+Alt+L)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </button>

  <!-- Toggle / Collapse button at the bottom -->
  <button class="toggle-btn" id="toggleSidebarBtn" title="طي الشريط الجانبي (Ctrl+Alt+S)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const accountsList = document.getElementById('accountsList');
    const addAccountBtn = document.getElementById('addAccountBtn');
    const privacyBtn = document.getElementById('privacyBtn');
    const lockBtn = document.getElementById('lockBtn');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const pullHandle = document.getElementById('pullHandle');
    const tooltip = document.getElementById('tooltip');

    let currentState = { accounts: [], activeId: 'default', theme: 'dark' };
    let isCollapsed = false;

    function getInitials(name) {
      if (!name) return 'W';
      const clean = name.trim();
      if (clean.length <= 2) return clean.toUpperCase();
      const words = clean.split(/\s+/);
      if (words.length > 1) {
        const w1 = words[0].replace(/^(ال)/, '') || words[0];
        const w2 = words[1].replace(/^(ال)/, '') || words[1];
        return (w1[0] + w2[0]).toUpperCase();
      }
      const single = clean.replace(/^(ال)/, '') || clean;
      return single.slice(0, 2).toUpperCase();
    }

    function render(state) {
      if (!state) return;
      currentState = state;
      document.documentElement.setAttribute('data-theme', state.theme || 'dark');
      if (typeof state.collapsed === 'boolean') {
        setCollapsedUI(state.collapsed);
      }
      if (privacyBtn) {
        privacyBtn.classList.toggle('active', !!state.privacyActive);
      }

      accountsList.innerHTML = '';
      const accounts = state.accounts || [];

      accounts.forEach((acc, index) => {
        const wrap = document.createElement('div');
        wrap.className = 'account-item-wrap' + (acc.id === state.activeId ? ' active' : '');

        const pill = document.createElement('div');
        pill.className = 'active-pill';
        pill.style.backgroundColor = acc.color || '#25D366';
        wrap.appendChild(pill);

        const btn = document.createElement('button');
        btn.className = 'account-btn';
        btn.textContent = getInitials(acc.name);
        btn.style.backgroundColor = acc.color ? `${acc.color}22` : '#202c33';
        btn.style.color = acc.color || '#e9edef';
        btn.style.borderColor = acc.id === state.activeId ? (acc.color || '#00a884') : 'transparent';

        const badge = document.createElement('div');
        badge.className = 'unread-badge' + (acc.unread > 0 ? ' visible' : '');
        badge.textContent = acc.unread > 99 ? '99+' : acc.unread;
        btn.appendChild(badge);

        if (acc.isSleeping) {
          btn.classList.add('sleeping');
          const sleepBadge = document.createElement('div');
          sleepBadge.className = 'sleep-badge';
          sleepBadge.textContent = '💤';
          btn.appendChild(sleepBadge);
        }

        btn.addEventListener('click', () => {
          if (window.api && acc.id !== currentState.activeId) {
            window.api.switchAccount(acc.id);
          }
        });

        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (window.api) window.api.showContextMenu(acc.id);
        });

        btn.addEventListener('mouseenter', () => {
          if (isCollapsed) return;
          const rect = btn.getBoundingClientRect();
          tooltip.textContent = `${acc.name} (Ctrl+${index + 1})`;
          tooltip.style.top = `${rect.top + (rect.height / 2) - 14}px`;
          tooltip.classList.add('show');
        });

        btn.addEventListener('mouseleave', () => {
          tooltip.classList.remove('show');
        });

        wrap.appendChild(btn);

        if (acc.id !== 'default') {
          const delBtn = document.createElement('button');
          delBtn.className = 'account-del-btn';
          delBtn.innerHTML = '&times;';
          delBtn.title = `حذف الحساب / Remove ${acc.name}`;
          delBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (window.api && window.api.removeAccount) {
              await window.api.removeAccount(acc.id);
            }
          });
          wrap.appendChild(delBtn);
        }

        accountsList.appendChild(wrap);
      });
    }

    function openAddModal() {
      if (window.api && window.api.openAddModal) {
        window.api.openAddModal();
      }
    }

    addAccountBtn.addEventListener('click', openAddModal);

    if (privacyBtn) {
      privacyBtn.addEventListener('click', () => {
        if (window.api && window.api.togglePrivacy) window.api.togglePrivacy();
      });
    }

    if (lockBtn) {
      lockBtn.addEventListener('click', () => {
        if (window.api && window.api.lockApp) window.api.lockApp();
      });
    }

    toggleSidebarBtn.addEventListener('click', () => {
      if (window.api && window.api.setCollapsed) {
        window.api.setCollapsed(true);
      }
    });

    pullHandle.addEventListener('click', () => {
      if (window.api && window.api.setCollapsed) {
        window.api.setCollapsed(false);
      }
    });

    document.body.addEventListener('mouseenter', () => {
      if (isCollapsed && window.api && window.api.setCollapsed) {
        window.api.setCollapsed(false);
      }
    });

    function setCollapsedUI(collapsed) {
      isCollapsed = !!collapsed;
      document.body.classList.toggle('collapsed', isCollapsed);
      if (isCollapsed) tooltip.classList.remove('show');
    }

    if (window.api) {
      window.api.getInitialState().then(render).catch(console.error);
      window.api.onStateChange(render);
      if (window.api.onCollapsedChange) {
        window.api.onCollapsedChange(setCollapsedUI);
      }
    }
  </script>
</body>
</html>
